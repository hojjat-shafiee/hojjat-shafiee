<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="35%" stop-color="#111827"/>
      <stop offset="70%" stop-color="#161b2c"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="ambient-cyan" cx="12%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambient-purple" cx="88%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1.2" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 58px;
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 21px;
      fill: #94a3b8;
    }
    .tech-pill {
      font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
    }
    .meta-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
      fill: #94a3b8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)"/>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="340" rx="16" fill="url(#ambient-cyan)"/>
  <rect width="1200" height="340" rx="16" fill="url(#ambient-purple)"/>

  <!-- Cyber Grid Pattern Overlay -->
  <rect width="1200" height="340" rx="16" fill="url(#cyber-grid)"/>

  <!-- Procedural Maze / Circuit Visual Graphic Elements on Right -->
  <g opacity="0.4" transform="translate(760, 25)">
    <!-- Procedural Maze Lines -->
    <path d="M 50 40 L 120 40 L 120 110 L 200 110 L 200 60 L 320 60 L 320 180 L 240 180 L 240 240 L 370 240" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4"/>
    <path d="M 80 140 L 80 200 L 170 200 L 170 270 L 290 270" fill="none" stroke="#818cf8" stroke-width="2.5"/>
    <path d="M 140 30 L 140 80 L 260 80 L 260 140 L 350 140" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Isometric Cube / Game Engine Nodes -->
    <g transform="translate(260, 90)">
      <polygon points="40,0 80,22 40,44 0,22" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
      <polygon points="0,22 40,44 40,90 0,68" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5"/>
      <polygon points="40,44 80,22 80,68 40,90" fill="#0ea5e9" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5"/>
    </g>
    <g transform="translate(130, 160)">
      <polygon points="30,0 60,16 30,32 0,16" fill="#c084fc" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.5"/>
      <polygon points="0,16 30,32 30,66 0,50" fill="#1e293b" fill-opacity="0.6" stroke="#c084fc" stroke-width="1.5"/>
      <polygon points="30,32 60,16 60,50 30,66" fill="#a855f7" fill-opacity="0.4" stroke="#c084fc" stroke-width="1.5"/>
    </g>
    <circle cx="120" cy="40" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="200" cy="110" r="4.5" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="320" cy="180" r="4.5" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="170" cy="200" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- Left Content Wrapper -->
  <g transform="translate(70, 52)">
    
    <!-- Top Pill / Role Badge -->
    <g transform="translate(0, 0)">
      <rect width="365" height="32" rx="16" fill="url(#badge-grad)" opacity="0.25"/>
      <rect width="365" height="32" rx="16" fill="none" stroke="url(#badge-grad)" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="5" fill="#10b981" filter="url(#glow)"/>
      <text x="32" y="21" class="badge-text">UNITY GAME DEV &amp; SYSTEMS ARCHITECT</text>
    </g>

    <!-- Main Title (Name) -->
    <text x="0" y="94" class="title" fill="url(#text-grad)">HOJJAT SHAFIEE</text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="138" class="subtitle">
      Crafting <tspan fill="#38bdf8" font-weight="600">Procedural Worlds</tspan>, Engaging Gameplay &amp; <tspan fill="#c084fc" font-weight="600">Autonomous AI Tools</tspan>
    </text>

    <!-- Tech Stack Tag Badges -->
    <g transform="translate(0, 175)">
      <!-- Tag 1: Unity -->
      <g transform="translate(0, 0)">
        <rect width="90" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="45" y="19" text-anchor="middle" class="tech-pill" fill="#f8fafc">Unity 3D</text>
      </g>
      <!-- Tag 2: C# -->
      <g transform="translate(100, 0)">
        <rect width="60" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="30" y="19" text-anchor="middle" class="tech-pill" fill="#38bdf8">C#</text>
      </g>
      <!-- Tag 3: Procedural -->
      <g transform="translate(170, 0)">
        <rect width="150" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="75" y="19" text-anchor="middle" class="tech-pill" fill="#a78bfa">Procedural Gen</text>
      </g>
      <!-- Tag 4: MCP / AI -->
      <g transform="translate(330, 0)">
        <rect width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="62" y="19" text-anchor="middle" class="tech-pill" fill="#f472b6">AI &amp; MCP Tooling</text>
      </g>
      <!-- Tag 5: FastAPI -->
      <g transform="translate(465, 0)">
        <rect width="95" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="47" y="19" text-anchor="middle" class="tech-pill" fill="#34d399">FastAPI</text>
      </g>
      <!-- Tag 6: VoIP -->
      <g transform="translate(570, 0)">
        <rect width="115" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="57" y="19" text-anchor="middle" class="tech-pill" fill="#fb923c">Mumble VoIP</text>
      </g>
    </g>

    <!-- Location & Status line -->
    <g transform="translate(0, 230)">
      <circle cx="6" cy="5" r="4" fill="#38bdf8"/>
      <text x="20" y="9" class="meta-text">
        Isfahan, Iran  •  Active on <tspan fill="#f472b6" font-weight="600">itch.io</tspan> &amp; Game Jams  •  Open to Collaborations
      </text>
    </g>

  </g>

  <!-- Bottom Accent Border Line with Gradient Glow -->
  <rect x="0" y="336" width="1200" height="4" fill="url(#border-glow)"/>
</svg>
