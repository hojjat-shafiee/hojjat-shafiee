<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="80%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Activity Wave Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Area Fill Gradient -->
    <linearGradient id="area-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </linearGradient>

    <!-- Stat Tile Background -->
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow-wave" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .header-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.5px;
      fill: #f8fafc;
    }
    .header-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .badge-pill {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .stat-number {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 26px;
      font-weight: 900;
      fill: #f8fafc;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      fill: #94a3b8;
    }
    .axis-label {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #64748b;
    }
  </style>

  <!-- Main Background Container -->
  <rect width="1200" height="310" rx="14" fill="url(#card-bg)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top Header Row -->
  <g transform="translate(45, 42)">
    <circle cx="10" cy="-6" r="6" fill="#10b981"/>
    <text x="26" y="0" class="header-title">ANNUAL CONTRIBUTION TREND &amp; COMMIT ACTIVITY</text>
    <text x="26" y="20" class="header-sub">Verified GitHub metrics across public repositories &amp; engine tools</text>

    <!-- Right Badge: 1,385 Contributions -->
    <g transform="translate(930, -18)">
      <rect width="180" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="18" cy="16" r="4.5" fill="#38bdf8"/>
      <text x="32" y="20" class="badge-pill" fill="#38bdf8">1,385 CONTRIBUTIONS</text>
    </g>
  </g>

  <!-- 3 Summary Metrics Cards -->
  <g transform="translate(45, 92)">
    <!-- Tile 1 -->
    <g transform="translate(0, 0)">
      <rect width="345" height="58" rx="8" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
      <circle cx="28" cy="29" r="14" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="28" y="34" text-anchor="middle" font-size="14" fill="#38bdf8">⚡</text>
      <text x="56" y="28" class="stat-number">1,385+</text>
      <text x="56" y="46" class="stat-label">TOTAL ANNUAL CONTRIBUTIONS</text>
    </g>

    <!-- Tile 2 -->
    <g transform="translate(382, 0)">
      <rect width="345" height="58" rx="8" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
      <circle cx="28" cy="29" r="14" fill="#a855f7" fill-opacity="0.15"/>
      <text x="28" y="34" text-anchor="middle" font-size="14" fill="#a855f7">🎯</text>
      <text x="56" y="28" class="stat-number">165 Days</text>
      <text x="56" y="46" class="stat-label">ACTIVE SPRINT &amp; COMMIT CADENCE</text>
    </g>

    <!-- Tile 3 -->
    <g transform="translate(765, 0)">
      <rect width="345" height="58" rx="8" fill="url(#tile-bg)" stroke="#334155" stroke-width="0.8"/>
      <circle cx="28" cy="29" r="14" fill="#10b981" fill-opacity="0.15"/>
      <text x="28" y="34" text-anchor="middle" font-size="14" fill="#10b981">🚀</text>
      <text x="56" y="28" class="stat-number">Consistent</text>
      <text x="56" y="46" class="stat-label">HIGH DEV VELOCITY &amp; GAME JAMS</text>
    </g>
  </g>

  <!-- Contribution Trajectory Wave Chart -->
  <g transform="translate(45, 175)">
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="0" x2="1110" y2="0" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 4"/>
    <line x1="0" y1="45" x2="1110" y2="45" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 4"/>
    <line x1="0" y1="90" x2="1110" y2="90" stroke="#334155" stroke-width="1"/>

    <!-- Area Fill Path under the Activity Curve -->
    <path d="M 0 75 Q 90 60 185 68 T 370 42 T 555 58 T 740 22 T 925 35 T 1110 12 L 1110 90 L 0 90 Z" fill="url(#area-fill)"/>

    <!-- Activity Wave Curve Line -->
    <path d="M 0 75 Q 90 60 185 68 T 370 42 T 555 58 T 740 22 T 925 35 T 1110 12" fill="none" stroke="url(#wave-grad)" stroke-width="3.5" filter="url(#glow-wave)"/>

    <!-- Data Surge Points -->
    <circle cx="185" cy="68" r="4.5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="370" cy="42" r="4.5" fill="#818cf8" stroke="#0f172a" stroke-width="2"/>
    <circle cx="555" cy="58" r="4.5" fill="#a855f7" stroke="#0f172a" stroke-width="2"/>
    <circle cx="740" cy="22" r="5" fill="#f472b6" stroke="#0f172a" stroke-width="2"/>
    <circle cx="925" cy="35" r="4.5" fill="#c084fc" stroke="#0f172a" stroke-width="2"/>
    <circle cx="1110" cy="12" r="5.5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>

    <!-- Month Axis Labels -->
    <text x="0" y="108" class="axis-label">Nov 2025</text>
    <text x="185" y="108" text-anchor="middle" class="axis-label">Jan 2026</text>
    <text x="370" y="108" text-anchor="middle" class="axis-label">Mar 2026</text>
    <text x="555" y="108" text-anchor="middle" class="axis-label">May 2026</text>
    <text x="735" y="108" text-anchor="middle" class="axis-label">Jul 2026 (Mazes)</text>
    <text x="915" y="108" text-anchor="middle" class="axis-label">Sep 2026 (MCP)</text>
    <text x="1110" y="108" text-anchor="end" class="axis-label">Nov 2026 (FastAPI / Game Off)</text>
  </g>
</svg>
